name: Build InfiniteFire Comms

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Fix and Regenerate Gradle Wrapper
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper || true

      - name: Deduplicate String Resources
        run: |
          cat << 'PYEOF' > clean.py
          import re, glob
          for p in glob.glob("app/src/main/res/values*/strings.xml"):
              with open(p, "r", encoding="utf-8") as f:
                  lines = f.read().splitlines()
              seen, out, skip = set(), [], False
              for l in lines:
                  m = re.search(r'<string\s+name="([^"]+)"', l)
                  if m:
                      if m.group(1) in seen:
                          skip = "</string>" not in l
                          continue
                      seen.add(m.group(1))
                  elif skip:
                      if "</string>" in l:
                          skip = False
                      continue
                  out.append(l)
              with open(p, "w", encoding="utf-8") as f:
                  f.write("\n".join(out) + "\n")
          PYEOF
          python3 clean.py

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee build.log || { echo "=== FAILURE SUMMARY ==="; grep -A 15 -B 2 "* What went wrong:" build.log; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteFire-Comms-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

name: Build InfiniteFire Comms

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Fix and Regenerate Gradle Wrapper
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper || true

      - name: Deduplicate String Resources
        run: |
          python3 -c '
          import re, glob
          files = glob.glob("app/src/main/res/values*/strings.xml")
          pattern = re.compile(r"<string\s+name=[\"\x27]([^\x27\"]+)[\"\x27]")
          for file_path in files:
              with open(file_path, "r", encoding="utf-8") as f:
                  lines = f.read().splitlines()
              seen = set()
              cleaned = []
              in_dup = False
              removed = 0
              for line in lines:
                  m = pattern.search(line)
                  if m:
                      name = m.group(1)
                      if name in seen:
                          removed += 1
                          if "</string>" in line:
                              continue
                          else:
                              in_dup = True
                              continue
                      else:
                          seen.add(name)
                  elif in_dup:
                      if "</string>" in line:
                          in_dup = False
                      continue
                  cleaned.append(line)
              if removed > 0:
                  print(f"Cleaned {removed} duplicate string(s) from {file_path}")
                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write("\n".join(cleaned) + "\n")
          '

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace || gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteFire-Comms-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
